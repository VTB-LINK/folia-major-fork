name: Sync from upstream

# Job 1 (sync-main): fast-forward the fork's main to upstream chthollyphile/folia-major:main
#   and mirror upstream release tags. main is a clean upstream mirror -- ff only, no --force,
#   so an accidental divergence fails loudly instead of being overwritten.
# Job 2 (sync-fork-release, runs after job 1): merge the freshly-synced main into the deployed
#   fork-release branch on a stable scratch branch (sync/upstream-main). A clean, verified merge
#   is opened -- or the already-open PR is updated in place with the newer code -- as a single
#   ready-to-review PR; conflicts (which need the obs / AI-relay resolution playbook and cannot be
#   auto-resolved) are filed as an issue instead. Nothing is pushed to fork-release automatically:
#   a human merges the PR, which is what triggers the Azure deploy. Chaining job 2 after job 1
#   guarantees the fork-release PR is always based on the just-synced main, never stale code.
#
# 定时（每 4 小时）+ 手动（workflow_dispatch）。
# 认证：checkout 用带 workflow scope 的 PAT（仓库 secret SYNC_PAT）——GitHub 禁止默认 GITHUB_TOKEN
#   推送 .github/workflows/ 的增改，上游一旦改动 workflow 文件 ff 推送就会被拒。SYNC_PAT 需
#   contents + workflows + pull-requests + issues 读写权限。
# tag 只镜像正式版本（vN.N.N），canary / rc / nightly / cielo 等测试标签一律跳过。

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync-main:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # PAT（带 workflow scope）用于推 main，含上游的 workflow 文件改动；见文件顶部说明。
          token: ${{ secrets.SYNC_PAT }}

      - name: Fast-forward main from upstream
        run: |
          set -euo pipefail
          git fetch https://github.com/chthollyphile/folia-major.git main
          echo "upstream main = $(git rev-parse --short FETCH_HEAD)"
          git push origin FETCH_HEAD:refs/heads/main

      - name: Mirror upstream release tags
        run: |
          set -euo pipefail
          git fetch --force --tags https://github.com/chthollyphile/folia-major.git
          # 只保留正式版本号 tag（vN.N.N），过滤掉 -canary / -rc / nightly / cielo 等测试标签。
          tags=$(git tag -l | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          for tag in $tags; do
            git push origin --force "refs/tags/$tag:refs/tags/$tag"
          done

  sync-fork-release:
    needs: sync-main
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.SYNC_PAT }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      SYNC_BRANCH: sync/upstream-main
    steps:
      - name: Checkout fork-release
        uses: actions/checkout@v4
        with:
          ref: fork-release
          fetch-depth: 0
          token: ${{ secrets.SYNC_PAT }}

      - name: Configure git identity
        run: |
          git config user.name "fork-sync-bot"
          git config user.email "fork-sync-bot@users.noreply.github.com"

      - name: Fetch the freshly-synced main (and any existing sync branch)
        run: |
          set -euo pipefail
          git config remote.origin.fetch '+refs/heads/*:refs/remotes/origin/*'
          git fetch origin

      - name: Decide whether a sync is needed
        id: plan
        run: |
          set -euo pipefail
          behind="$(git rev-list --count fork-release..origin/main)"
          sha="$(git rev-parse --short origin/main)"
          need=false
          if [ "$behind" != "0" ]; then
            need=true
            # Skip if the existing sync branch already contains this main AND is based on the
            # current fork-release -- the open PR is already up to date, so there is nothing new
            # to stack and no point re-running npm ci / the build.
            if git rev-parse --verify "origin/${SYNC_BRANCH}" >/dev/null 2>&1; then
              if git merge-base --is-ancestor origin/main "origin/${SYNC_BRANCH}" \
                 && git merge-base --is-ancestor fork-release "origin/${SYNC_BRANCH}"; then
                need=false
              fi
            fi
          fi
          echo "need=$need" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "fork-release is $behind behind origin/main ($sha); sync needed: $need"

      - name: Merge the synced main on the sync branch
        id: merge
        if: steps.plan.outputs.need == 'true'
        run: |
          set -uo pipefail
          git checkout -B "${SYNC_BRANCH}" fork-release
          if git merge --no-ff --no-edit origin/main; then
            echo "result=clean" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > /tmp/conflicts.txt
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the clean merge (typecheck, tests, build)
        id: verify
        if: steps.merge.outputs.result == 'clean'
        continue-on-error: true
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run -c vitest.config.ts
          npx vite build

      - name: Push the sync branch and open / update the PR
        if: steps.merge.outputs.result == 'clean'
        run: |
          set -euo pipefail
          git push --force origin "${SYNC_BRANCH}"
          if [ "${{ steps.verify.outcome }}" = "success" ]; then
            body="Automated clean merge of upstream main (\`${{ steps.plan.outputs.sha }}\`) into \`fork-release\`. Typecheck, unit tests and \`vite build\` all passed in the sync run. Review and merge to deploy."
          else
            body="Automated clean merge of upstream main (\`${{ steps.plan.outputs.sha }}\`) into \`fork-release\`, but **verification FAILED** in the sync run (typecheck / tests / build) -- read the workflow logs before merging. A textually-clean merge can still be broken semantically by upstream changes."
          fi
          num="$(gh pr list --state open --base fork-release --head "${SYNC_BRANCH}" --json number --jq '.[0].number // empty')"
          if [ -z "$num" ]; then
            gh pr create --base fork-release --head "${SYNC_BRANCH}" \
              --title "Sync fork-release <- upstream main" --body "$body"
          else
            gh pr edit "$num" --body "$body"
            gh pr comment "$num" --body "Restacked onto newer upstream main (\`${{ steps.plan.outputs.sha }}\`)."
          fi

      - name: File / update a conflict issue
        if: steps.merge.outputs.result == 'conflict'
        run: |
          set -euo pipefail
          {
            echo "Merging upstream main (\`${{ steps.plan.outputs.sha }}\`) into \`fork-release\` hit conflicts that need the semantic resolution playbook, so they were not auto-resolved."
            echo
            echo "**Conflicted files:**"
            echo '```'
            cat /tmp/conflicts.txt
            echo '```'
            echo
            echo "**Resolution playbook:**"
            echo "- obs files, incl. the now-upstreamed Custom CSS feature (obsCustomCss / ObsCopyCssButton / ObsWebSourceApp consumer / command-palette obs-css command, plus appearanceCodec / appearanceImportPlan / ImportConfirmDialog / webObsTarget + obs tests): take **upstream's** version -- the OBS Custom CSS assets feature was upstreamed, so these files now converge on upstream (near-identical)."
            echo "- obs AI layer (gemini \`ObsAiConfig\` + requestBody, obsWebAppearance \`parseObsAiParams\`, currentObsUrl ai block, useObsAiTheme): keep the **fork's** key-in-URL relay."
            echo "- ObsCopyUrlButton: keep the fork's \`containerClassName\` + upstream's width-reserve fix."
            echo "- store / i18n: take the **union** (fork keys + upstream keys). i18n key reordering can leave a kept fork-side key duplicated with an upstream copy elsewhere -- after resolving, grep each kept key's count and drop the extra. Fork-only i18n keys: obsAiKeyLeakWarning, agplNotice."
            echo "- ControlsTab: take **upstream's** componentized version -- the fork OBS copy buttons and player-UI quick-toggle rows were dropped by the 2026-08-21 align decision. The five toggles (transparentPlayerBackground / autoHidePlayerChrome / hidePlayerProgressBar / hidePlayerTranslationSubtitle / showHarmonySubtitle) stay in Lab / Appearance settings; keep the fork defaults there (guarded by the useSettingsUiStore.defaults test)."
            echo "- fork infra (forkSource / webAiConfig / swa-api / Azure + sync workflows / Clarity / online-provider switcher isElectron-gate): keep the **fork's**."
            echo
            echo "Resolve locally on a branch off \`fork-release\` (back up \`backup/fork-release-<sha>\` first), then merge to deploy. Close this issue once fork-release contains the upstream commit."
          } > /tmp/issue.md
          title="Manual sync needed: fork-release <- upstream main"
          num="$(gh issue list --state open --search "in:title \"$title\"" --json number,title --jq "[.[] | select(.title == \"$title\")] | .[0].number // empty")"
          if [ -z "$num" ]; then
            gh issue create --title "$title" --body-file /tmp/issue.md
          else
            gh issue edit "$num" --body-file /tmp/issue.md
            gh issue comment "$num" --body "Still conflicting as of upstream \`${{ steps.plan.outputs.sha }}\`."
          fi
