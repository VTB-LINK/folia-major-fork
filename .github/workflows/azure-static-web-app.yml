name: Deploy fork-release to Azure Static Web Apps

# 部署 fork 到 Azure Static Web Apps（应用 folia-fork-vtb-tools）。
# 触发：push 到 fork-release，或手动。
# 前端：vite build（跳过 build:vercel-api，那是给 Vercel 的函数）。
# API：swa-api/（Azure Functions v4 托管函数）——AI 主题「无密钥中继」，用户自带 key，
#   部署方无需设任何服务端密钥；SWA 用 api_build_command 跑 esbuild 打包。
# 需仓库 secret：AZURE_STATIC_WEB_APPS_API_TOKEN = 该 SWA 的部署令牌（“管理部署令牌”获取）。
on:
  push:
    branches:
      - fork-release
  workflow_dispatch:

env:
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (web only, skip build:vercel-api)
        run: npx vite build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          api_location: "swa-api"
          api_build_command: "npm run build"
          output_location: ""
          skip_app_build: true

  # 独立的 CDN 预热 job，与部署解耦（部署状态保持清晰、不被预热拖长）。
  # 起因：Azure SWA 换上新一批 hash chunk 后，边缘/origin 首次回源很慢（实测冷回源
  # 30–60s），会撞网关 504，使 bootstrap 的动态 import 失败而整页白屏。这里等部署
  # propagate 后，从 live 的 sw.js 取出 precache 清单逐个拉一遍把缓存喂热，让真实用户
  # 不再承担首次冷回源。best-effort：预热结果不影响部署（部署已在上一个 job 成功）。
  warm_cache:
    needs: build_and_deploy
    if: success()
    runs-on: ubuntu-latest
    name: Warm CDN cache
    steps:
      - name: Wait for propagation, then warm
        continue-on-error: true
        timeout-minutes: 20
        run: |
          set +e
          BASE="https://folia.fork.vtb.tools"
          echo "等待部署 propagate（3 分钟）..."
          sleep 180
          echo "轮询确认站点可访问..."
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$BASE/sw.js")
            echo "  sw.js -> $code (try $i)"
            [ "$code" = "200" ] && break
            sleep 10
          done
          curl -s --max-time 90 "$BASE/sw.js" -o sw.js
          grep -oE 'assets/[A-Za-z0-9._-]+\.(js|css)' sw.js | sort -u > assets.txt
          printf 'index.html\nsw.js\nstage-client.html\n' >> assets.txt
          echo "预热 $(wc -l < assets.txt) 个文件（两轮：第一轮喂热、第二轮校验）"
          for round in 1 2; do
            echo "--- 第 $round 轮 ---"
            cat assets.txt | xargs -P 20 -I{} curl -s -o /dev/null --max-time 120 \
              -w '%{http_code} %{time_total}s {}\n' "$BASE/{}" \
              | awk '$1!="200"{print "  非200: "$0}'
          done
          echo "预热完成（best-effort）"
